[project]
name = "rtsos"
description = "Radiative Transfer model based on Successive Orders of Scattering"
authors = [
  {name = "Pengwang Zhai", email = "pwzhai@gmail.com"},
  {name = "Ian Carroll", email = "ian.t.carroll@nasa.gov"}
]
license = "CC-BY-NC-4.0"
dynamic = ["version"]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Fortran",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.3",
    "xarray>=2022.3",
    "netcdf4>=1.6.1",
    "dask>=2022.10.2",
]

[project.urls]
repository = "https://github.com/aoog-umbc/rtsos"

[project.scripts]
rtsos = "rtsos.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "black",
]

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
sdist.include = ["src/rtsos/_version.py"]
# Distribution contents must not depend on a developer's personal Git ignores.
sdist.exclude = [
    "/audit/",
    "/RTSOS_data/",
    "/Data/",
    "/Auxiliary_Files/",
    "/Gas_Absorption_Coefficients/",
]
# Tests use the examples and configuration shipped together in the sdist.
wheel.exclude = ["rtsos/tests/**"]
minimum-version = "build-system.requires"
cmake.args = ["-G", "Unix Makefiles"]

[tool.setuptools_scm]
write_to = "src/rtsos/_version.py"
# The public release tag carries a date suffix, outside its PEP 440 version.
tag_regex = '^v?(?P<version>.+?)(?:-public-\d{4}-\d{2}-\d{2})?$'

[tool.pytest.ini_options]
cache_dir = "test/.pytest_cache"
markers = ["native: integration tests requiring native executables and auxiliary data"]

[build-system]
requires = ["scikit-build-core>=0.11", "setuptools-scm>=8", "numpy>=2.1"]
build-backend = "scikit_build_core.build"
