# Complete selected response integration for a Lambertian land scene.
[sensor]
name = "custom"
response_file = "response.toml"
response_format = "toml"
channels = ["red", "blue"]
mirror = 0

[scene.surface]
model = "lambertian_fresnel"
spectrum = "land_spectrum.txt"

[scene.aerosol]
tau_ref_hi = 0.125

[geometry]
mode = "pace_grid"
solar_zenith_deg = 20.0
sensor_height_km = 2.0
zenith_count = 2
azimuth_count = 2

[physics]
scattering = "vector"

[numerics]
ncolinput = 8
nquadainput = 12
nquadoinput = 24
MAXMORDINPUT = 3

[illumination]
source = "thuillier"

[spectral]
method = "response_integration"

[data]
root = "../RTSOS_data"
