# UV atmosphere over an illustrative constant Ross-Li surface spectrum.
[sensor]
name = "UV land"

[scene.atmosphere]
profile = "afglus.dat"
OZONE_COLUMN_DobsonUnit = 350.0 # DU
H2O_COLUMN = 1.5               # cm
NO2_COLUMN_DobsonUnit = 0.25   # DU
Pressure_Surface_mb = 1000.0  # mb

[scene.aerosol]
Aerosol_Model = -1
Aerosol_FMF = 0.5
Relative_Humidity = 0.5
wv_pace_ref = 532.0 # nm; optical-depth normalization, separate from evaluation
tau_ref_hi = 0.125
height_particle_hi = 15.0          # km
height_particle_variance_hi = 2.0 # Gaussian FWHM, km
tau_ref_low = 0.0
height_particle_low = -1.0
height_particle_variance_low = -1.0

[scene.surface]
model = "ross_li"
spectrum = "ross_li_spectrum.txt" # seven columns, wavelengths in nm

[geometry]
mode = "explicit_directions"
solar_zenith_deg = 30.0
sensor_height_km = 2.0
# Propagation zenith from upward vertical; azimuth from solar propagation plane.
viewing_zenith_deg = [0.0, 30.0, 30.0]
relative_azimuth_deg = [0.0, 63.0, -63.0]

[physics]
scattering = "vector"
spherical_shell = false
atmosphere = true
gas_absorption = true

# Editable operating settings; see the guide for measured resolution sensitivity.
[numerics]
ncolinput = 8
nquadainput = 12
nquadoinput = 24 # inactive for land
MAXMORDINPUT = 3

[illumination]
source = "thuillier" # explicit choice independent of sensor label

[spectral]
method = "monochromatic"
wavelength_unit = "um"
wavelengths = [0.350, 0.380]

[data]
root = "../RTSOS_data"
